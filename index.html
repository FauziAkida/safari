<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport"  content="width=device-width, initial-scale=1.0">

<title>Akida Booking System</title>
<meta property="og:title" content="Akida Booking System">
<meta property="og:description" content="The Safari and Travel Booking Pass">

<link rel="stylesheet" href="stylexx.css">

</head>

<body id="main">
<h1>The Safari & Travel Booking Pass</h1>
<p>Tourism, transport, or park entry passes.</p>

<div class="first-head">
<input type="text" id="visitor" placeholder="Visitor Name">
<input type="text" id="destination" placeholder="Destination Park">
<input type="text" id="date" placeholder="Travel Date">
<input type="text" id="guest" placeholder="Number of Guests">

</div>
<div class="second-head">
<button type="button" onclick="document.getElementById('travelor').innerHTML = 'Welcome, ' + document.getElementById('visitor').value + '! Your trip to ' + document.getElementById('destination').value + ' on ' + document.getElementById('date').value + ' for ' + document.getElementById('guest').value + ' guest(s) is confirmed.'">
    Submit
  </button>
<p id="travelor">where I am going?</p>

<button type="button" onclick="document.getElementById('visitor').value = ''; document.getElementById('destination').value = ''; document.getElementById('date').value = ''; document.getElementById('guest').value = ''; document.getElementById('travelor').innerHTML = 'where I am going?'">
    Reset
  </button>

<button class="print-button" type="button" onclick="window.print()">
  Print / Save as PDF
</button>
</div>

</body>


</html>
